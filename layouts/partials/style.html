<style>
    /* Import Inter font for headings */
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
    
    /* Import a nice serif font for body text - using Newsreader as an example */
    @import url('https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap');
  
    :root {
        --width: 720px;
        --font-main: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        --font-secondary: 'Newsreader', Georgia, 'Times New Roman', serif;
        --font-scale: 1.05em;  /* Slightly increased base font size */
        --background-color: #faf9f5; /* Claude-like background color */
        --heading-color: #222;
        --text-color: #444;
        --link-color: #3273dc;
        --visited-color: #8b6fcb;
        --code-background-color: #f0f0f2;
        --code-color: #222;
        --blockquote-color: #222;
    }
  
    @media (prefers-color-scheme: dark) {
        :root {
            --background-color: #1e1e25; /* Dark Claude-like background color */
            --heading-color: #eee;
            --text-color: #ddd;
            --link-color: #8cc2dd;
            --visited-color: #8b6fcb;
            --code-background-color: #2d2d35;
            --code-color: #ddd;
            --blockquote-color: #ccc;
        }
    }
  
    body {
        font-family: var(--font-secondary);
        font-size: var(--font-scale);
        margin: auto;
        padding: 20px;
        max-width: var(--width);
        text-align: left;
        background-color: var(--background-color);
        word-wrap: break-word;
        overflow-wrap: break-word;
        line-height: 1.6;  /* Increased line height for better readability */
        color: var(--text-color);
    }
  
    h1, h2, h3, h4, h5, h6 {
        font-family: var(--font-main);
        color: var(--heading-color);
        font-weight: 600;
        line-height: 1.3;
    }
  
    a {
        color: var(--link-color);
        cursor: pointer;
        text-decoration: none;
    }
  
    a:hover {
        text-decoration: underline;
    }
  
    nav a {
        margin-right: 8px;
        font-family: var(--font-main);
        font-weight: 500;
    }
  
    strong, b {
        color: var(--heading-color);
    }
  
    button {
        margin: 0;
        cursor: pointer;
    }
  
    time {
        font-family: var(--font-main);
        font-style: normal;
        font-size: 0.8em;
        font-weight: 400;
    }
  
    main {
        line-height: 1.7;
        font-size: 1.1em
    }
  
    article {
        font-family: var(--font-secondary);
        font-size: 1em;  /* Increased article text size */
    }
  
    article p {
        margin-bottom: 1.2em;  /* More space between paragraphs */
    }
  
    table {
        width: 100%;
    }
  
    hr {
        border: 0;
        border-top: 1px dashed;
    }
  
    img {
        max-width: 100%;
    }
  
    code {
        font-family: monospace;
        padding: 2px;
        background-color: var(--code-background-color);
        color: var(--code-color);
        border-radius: 3px;
    }
  
    blockquote {
        border-left: 2px solid #999;
        color: var(--blockquote-color);
        padding-left: 20px;
        font-style: italic;
    }
  
    footer {
        padding: 25px 0;
        text-align: center;
        font-family: var(--font-main);
        font-size: 0.9em;
    }
  
    .title:hover {
        text-decoration: none;
    }
  
    .title h1 {
        font-size: 1.7em;  /* Larger title */
    }
  
    .inline {
        width: auto !important;
    }
  
    .highlight, .code {
        padding: 1px 15px;
        background-color: var(--code-background-color);
        color: var(--code-color);
        border-radius: 3px;
        margin-block-start: 1em;
        margin-block-end: 1em;
        overflow-x: auto;
    }
  
    /* blog post list */
    ul.blog-posts {
        list-style-type: none;
        padding: unset;
    }
  
    ul.blog-posts li {
        display: flex;
        margin-bottom: 1em;  /* More space between list items */
    }
  
    ul.blog-posts li span {
        flex: 0 0 130px;
        font-family: var(--font-main);
        font-size: 0.9em;
    }
  
    ul.blog-posts li a {
        font-family: var(--font-secondary);
        font-size: 1.1em;  /* Larger list links */
    }
  
    ul.blog-posts li a:visited {
        color: var(--visited-color);
    }
  </style>
